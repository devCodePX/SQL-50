<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsudoElement</title>

    <style>

        .container{

            width: auto;
            height: auto;
            border: 3px solid purple;
            display: grid;
            place-items: center;
        }

        .container h1{

            position: relative;
        }

        h1::before{

            top: -15px;
            position: absolute;
            content: "hello";
            font-size: 25px;
        }

        h1::after{

            right: 0;
            bottom: -15px;
            
            position: absolute;
            content: "What's up?";
            font-size: 20px;
        }
    </style>
</head>
<body>
    
    <section >

        <div class = "container">
            <h1>Priyanshu</h1>
        </div>
    </section>
</body>
</html>
