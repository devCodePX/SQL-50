<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiction</title>

    <style>

        body{

            background-color: bisque;
        }

        .box{

            width: 50px;
            aspect-ratio: 1;
            background-color: blue;
            transition: all 2s ease-in-out;
           

        }

        .box:hover{

            background-color: pink;
            width: 100px;
            
        }
    </style>
</head>
<body>
    
    <div class="container">

        <div class="box"></div>
    </div>
</body>
</html>
