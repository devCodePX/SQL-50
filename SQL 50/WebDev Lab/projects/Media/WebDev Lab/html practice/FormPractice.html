<!DOCTYPE HTML>
<html>

<head>
    <title>Form Practice</title>
</head>
<body>
    
    <form action="">

        <fieldset>
            <legend>Sing Up Form</legend>
            <br>

        <label for="firstName">First Name: </label>
        <input type="text" name="firstName" id="firstName">

        <label for="lastName">Last Name: </label>
        <input type="text" name="lastName" id="lastName">
        <br>
        <br>

        <label for="">Date of birth:</label>
        <input type="date" name="date" id="date">

        <label for="age">Age</label>
        <input type="number" id="age" value="age" min="0" max="60">
        <br>
        <br>

        <label for="gender">Gender:</label>
        <select name="gender" id="gender" >

            <optgroup label="Select">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
            </optgroup>
            
        </select>

        <label for="email">Email Address</label>
        <input type="email" name="email" id="email" placeholder="Enter email address">
        
        <br>
        <br>

        <label for="positions">Positions Availabe: </label>
        <input type="radio" value="junior" id="junior" name="positions">
        <label for="junior" >Junior Developer</label>
        <input type="radio" value="mid" id="mid" name="positions">
        <label for="mid">Mid Developer</label>
        <input type="radio" value="senior" id="senior" name="positions">
        <label for="senior">Senior Developer</label>

        <br>
        <br>
        
        <label for="proLang">Programming Languages:</label>

        <input type="checkbox" value="java" id="java">
        <label for="java">Java</label>
        
        <input type="checkbox" value="javaScript" id="javaScript">
        <label for="javaScript">javaScript</label>

        
        <input type="checkbox" value="python" id="python">
        <label for="python">Python</label>


        <br>
        <br>

        <label for="">Create Password =</label>
        <br>
        <br>

        <label for="pass">Password:</label>
        <input type="password" id="pass">

        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword">
        <br>
        <br>
        <label for="photo">Choose Photo</label>
        <input type="file" id="photo">
        <br>
        <br>
        
        <input type="submit" value="Submit" id="submit">
        <input type="reset" value="Reset" id="reset">
        </fieldset>
    
    </form>
</body>
</html>
